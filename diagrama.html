<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Diagrama BIOS (imprimir)</title>
  <style>
    body { font-family: "Courier New", monospace; margin: 30px; color: #000; background: #fff; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p { margin-top: 0; }
    .g { display: grid; gap: 0; border: 3px solid #000; width: max-content; }
    .g div { width: 70px; height: 70px; border: 1px solid #0003; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; }
    @media print { button { display: none; } }
  </style>
</head>
<body>
  <h1>DIAGRAMA DE TRILHAS — PLACA-MÃE</h1>
  <p>Documento técnico confidencial. Rev. 6.6.6</p>
  <div class="g" id="g"></div>
  <br><button onclick="print()">🖨 Imprimir</button>
  <script src="js/config.js"></script>
  <script>
    const B = CONFIG.bios, g = document.getElementById("g");
    g.style.gridTemplateColumns = `repeat(${B.grid[0].length}, 70px)`;
    B.grid.forEach((row) => [...row].forEach((ch) => {
      const k = ch.toUpperCase(), d = document.createElement("div");
      d.style.background = B.colors[k].color + (ch === k ? "" : "66");
      if (ch === k) d.textContent = B.colors[k].label;
      g.appendChild(d);
    }));
  </script>
</body>
</html>
