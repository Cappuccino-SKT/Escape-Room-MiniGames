<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Papéis da sala – imprimir</title>
<!-- Papéis da sala, gerados a partir de js/config.js. Abra no Chrome e use Ctrl+P (A4).
     Página 1 = Manual de comandos (fase 4), página 2 = Tabela de correções (fase 4),
     página 3 = Chave de recuperação (fase 5, paisagem): rasgue nas linhas tracejadas e esconda cada pedaço. -->
<style>
  @page { size: A4; margin: 12mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Courier New", monospace; color: #111; background: #888; }
  .page { width: 210mm; min-height: 297mm; margin: 10mm auto; padding: 14mm; background: #f4f1ea; position: relative;
    page-break-after: always; overflow: hidden; }
  @media print { body { background: none; } .page { margin: 0; width: auto; min-height: 270mm; box-shadow: none; } }
  h1 { margin: 0 0 4mm; font-size: 30px; letter-spacing: .15em; text-align: center; color: #7a0000; }
  .sub { text-align: center; font-size: 14px; margin-bottom: 8mm; color: #444; }
  .foot { position: absolute; bottom: 10mm; left: 0; right: 0; text-align: center; font-size: 12px; color: #7a0000; letter-spacing: .3em; }

  /* Manual de comandos: espalhados pela folha */
  .scatter { position: relative; height: 225mm; }
  .chip { position: absolute; border: 3px solid #111; background: #fff; padding: 3mm 5mm; text-align: center; }
  .chip b { display: block; font-size: 34px; }
  .chip span { font-size: 30px; font-weight: bold; color: #7a0000; }

  /* Chave de recuperação (paisagem). O desenho atravessa os pedaços para dar para montar na ordem. */
  @page key { size: A4 landscape; margin: 10mm; }
  .page.key { page: key; width: 297mm; min-height: 210mm; }
  @media print { .page.key { min-height: 185mm; } }
  .keywrap { position: relative; height: 150mm; margin-top: 6mm; }
  .keywrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pieces { position: relative; display: flex; height: 100%; }
  .piece { flex: 1; display: flex; align-items: center; justify-content: center; border-right: 2px dashed #555; }
  .piece:last-child { border-right: 0; }
  .piece span { font-size: 62px; font-weight: bold; background: #f4f1ea; padding: 2mm 3mm; letter-spacing: .05em; }
  .cut { text-align: center; font-size: 12px; color: #555; margin-top: 3mm; }

  /* Tabela de correções */
  table { width: 100%; border-collapse: collapse; font-size: 24px; }
  td { border: 3px solid #111; padding: 4mm 6mm; background: #fff; }
  td.n { width: 30mm; text-align: center; font-size: 34px; font-weight: bold; color: #7a0000; }
</style>
</head>
<body>
  <section class="page">
    <h1>MANUAL DE COMANDOS</h1>
    <div class="sub">JIGSAW OS – comandos aceitos pelo cmd</div>
    <div class="scatter" id="scatter"></div>
    <div class="foot">VIVER OU MORRER</div>
  </section>

  <section class="page">
    <h1>TABELA DE CORREÇÕES</h1>
    <div class="sub">Cada correção do sistema tem um número</div>
    <table id="table"></table>
    <div class="foot">FAÇA SUA ESCOLHA</div>
  </section>

  <section class="page key">
    <h1>CHAVE DE RECUPERAÇÃO</h1>
    <div class="keywrap">
      <svg id="keyart" viewBox="0 0 1000 500" preserveAspectRatio="none"></svg>
      <div class="pieces" id="pieces"></div>
    </div>
    <div class="cut">✂ rasgue nas linhas tracejadas e esconda cada pedaço pela sala ✂</div>
  </section>

<script src="js/config.js"></script>
<script>
  const R = CONFIG.reconfig;
  // Sorteio com seed fixa: a folha sai igual toda vez que for impressa
  let seed = 666;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

  // Manual: números + comandos (reais e falsos) em posições embaralhadas de uma grade 4 x 5, com leve deslocamento e rotação
  const all = [...R.tasks, ...R.decoys].map((t) => ({ num: t.num, cmd: t.cmd }));
  const cells = [];
  for (let r = 0; r < 6; r++) for (let c = 0; c < 4; c++) cells.push([c, r]);
  for (let i = cells.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [cells[i], cells[j]] = [cells[j], cells[i]]; }
  document.getElementById("scatter").innerHTML = all.map((t, i) => {
    const [c, r] = cells[i];
    const x = c * 25 + rnd() * 6, y = r * 16.3 + rnd() * 4, rot = (rnd() - 0.5) * 16;
    return `<div class="chip" style="left:${x}%;top:${y}%;transform:rotate(${rot}deg)"><b>${t.num}</b><span>${t.cmd}</span></div>`;
  }).join("");

  // Chave: um bloco por pedaço + linhas e texto que atravessam todos (ajudam a montar na ordem)
  const parts = CONFIG.ransom.key.split("-");
  document.getElementById("pieces").innerHTML = parts.map((p) => `<div class="piece"><span>${p}</span></div>`).join("");
  let wave = "M0 120", wave2 = "M0 400";
  for (let x = 50; x <= 1000; x += 50) { wave += ` L${x} ${80 + rnd() * 90}`; wave2 += ` L${x} ${360 + rnd() * 90}`; }
  document.getElementById("keyart").innerHTML =
    `<path d="${wave}" stroke="#a00" stroke-width="6" fill="none"/>` +
    `<path d="${wave2}" stroke="#111" stroke-width="4" fill="none" stroke-dasharray="14 8"/>` +
    `<text x="500" y="300" text-anchor="middle" font-size="150" font-weight="bold" fill="#0001" font-family="Courier New">VIVER OU MORRER</text>`;

  // Tabela: correções em ordem alfabética, com o número
  document.getElementById("table").innerHTML = [...R.tasks]
    .sort((a, b) => a.task.localeCompare(b.task, "pt-BR"))
    .map((t) => `<tr><td>${t.task}</td><td class="n">${t.num}</td></tr>`).join("");
</script>
</body>
</html>
